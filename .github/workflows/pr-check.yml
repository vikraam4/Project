name: PR Code Review Bot

on:
  pull_request:
    branches: [main]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout full history (IMPORTANT FIX)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Get PR diff safely (NO git merge-base errors)
      - name: Get PR Diff
        id: diff
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = context.payload.pull_request.number;

            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              mediaType: { format: "diff" }
            });

            return data;

      # 3️⃣ Save diff to file
      - name: Save Diff
        run: |
          echo "${{ steps.diff.outputs.result }}" > diff.txt

      # 4️⃣ Analyze Diff (Bug Detection)
      - name: Analyze Code
        id: analyze
        run: |
          REPORT=""

          if grep -qi "console.log" diff.txt; then
            REPORT="$REPORT ⚠️ console.log found\n"
          fi

          if grep -qi "TODO" diff.txt; then
            REPORT="$REPORT ⚠️ TODO found\n"
          fi

          if grep -qi "any" diff.txt; then
            REPORT="$REPORT ⚠️ 'any' type used (TS risk)\n"
          fi

          if grep -qi "password\|secret\|token" diff.txt; then
            REPORT="$REPORT 🚨 Possible secret detected\n"
          fi

          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5️⃣ FAIL BUILD if critical issue
      - name: Fail on Critical Issues
        run: |
          echo "${{ steps.analyze.outputs.report }}"

          if echo "${{ steps.analyze.outputs.report }}" | grep -q "🚨"; then
            echo "Critical issue found - blocking merge"
            exit 1
          fi

      # 6️⃣ Comment on PR
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.analyze.outputs.report }}`;

            const body =
              `🤖 Real PR Code Review Bot\n\n` +
              `${report || "✅ No issues found"}\n\n` +
              `---\n` +
              `Checks:\n` +
              `- console.log detection\n` +
              `- TODO detection\n` +
              `- TypeScript unsafe 'any'\n` +
              `- Secret pattern scan`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });